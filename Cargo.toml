[package]
name = "rexue"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native terminal session picker for Rex, inspired by sesh"
license = "MIT"
repository = "https://github.com/nicholasxjy/rexue"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = "0.28"
dirs = "6"
fs2 = "0.4"
humantime = "2"
nucleo-matcher = "0.3"
ratatui = "0.29"
regex = "1"
libc = "0.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
shellexpand = "3"
strip-ansi-escapes = "0.2"
toml = "0.8"
tree-sitter = "0.26.13"
tree-sitter-bash = "0.25.1"
unicode-width = "0.2"
unicode-casefold = "0.2"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
