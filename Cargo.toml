[package]
name = "rexue"
version = "0.1.11"
edition = "2024"
rust-version = "1.90"
description = "Rex session and Worktrunk worktree management with fzf"
license = "MIT"
repository = "https://github.com/nicholasxjy/rexue"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
fs2 = "0.4.3"
humantime = "2.4.0"
regex = "1.13.1"
libc = "0.2.191"
signal-hook = "0.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
shellexpand = "3.1.2"
strip-ansi-escapes = "0.2.1"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
unicode-width = "0.2.3"
unicode-casefold = "0.2.0"
wait-timeout = "0.2.1"

tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
