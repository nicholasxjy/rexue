# Save as $XDG_CONFIG_HOME/rexue/rexue.toml (or ~/.config/rexue/rexue.toml).
# Explicit --config-file paths must exist. Unknown fields are errors in strict mode.
strict_mode = true
cache = false
import = [] # Exact filenames; append session, wildcard and worktree definitions.
blacklist = ["scratch"]
sort_order = ["rex", "agent", ["config", "zoxide"], "directory", "worktree"]
dir_length = 1
git_dir_length = 1
git_namer_use_worktree_root = false
separator_aware = false

[[name_substitution]]
find = '^~/Projects/(.*)$'
replace = '$1'
regex = true

[icons.agent]
icon = "󰚩"
color = "magenta"

[icons.rex]
icon = ""
color = "blue"

[icons.config]
icon = ""
color = "bright-black"

[default_session]
preview_command = "ls -la {}"

# First matching wildcard wins. A trailing /** matches descendants, excluding its root.
[[wildcard]]
pattern = "~/Projects/**"
startup_command = "git status --short"
icon = ""

[[session]]
name = "projects"
path = "~/Projects"
alias = "p"
alias_auto_connect = true
startup_command = ""
disable_startup_command = false
icon = ""

# zoxide is used by default. Optional nonempty commands replace each operation.
# [frecency]
# list_command = "zoxide query --list --score"
# query_command = "zoxide query -- {}"
# add_command = "zoxide add -- {}"
# remove_command = "zoxide remove -- {}"

# Worktrunk manages paths, branches, hooks and approvals.
[[worktree]]
path = "~/Projects/app"
icon = ""

[tui]
show_icons = true
prompt = "> "
placeholder = "Filter Sessions..."
pointer = "> "
alias_auto_connect_delay = "150ms"
alias_filter_prefix = "/"
preview = true
preview_width = 60
preview_min_width = 100
preview_border = "line"
group_separator = false
