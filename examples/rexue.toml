# Save as $XDG_CONFIG_HOME/rexue/rexue.toml (or ~/.config/rexue/rexue.toml).
# Explicit --config-file paths must exist. Unknown fields are errors in strict mode.
strict_mode = true
cache = false
import = [] # Exact filenames; append session, wildcard and worktree definitions.
blacklist = ["scratch"]
sort_order = ["rex", "agent", ["config", "zoxide"], "directory", "worktree"]
dir_length = 1
git_dir_length = 1
git_namer_use_worktree_root = false
separator_aware = false

[[name_substitution]]
find = '^~/Projects/(.*)$'
replace = '$1'
regex = true

[icons.agent]
icon = "󰚩"
color = "magenta"

[icons.rex]
icon = ""
color = "blue"

[icons.config]
icon = ""
color = "bright-black"

[default_session]
preview_command = "ls -la {}"

# First matching wildcard wins. A trailing /** matches descendants, excluding its root.
[[wildcard]]
pattern = "~/Projects/**"
startup_command = "git status --short"
icon = ""

[[session]]
name = "projects"
path = "~/Projects"
alias = "p"
alias_auto_connect = true
startup_command = ""
disable_startup_command = false
icon = ""

# zoxide is used by default. Optional nonempty commands replace each operation.
# [frecency]
# list_command = "zoxide query --list --score"
# query_command = "zoxide query -- {}"
# add_command = "zoxide add -- {}"
# remove_command = "zoxide remove -- {}"

# Worktrunk manages paths, branches, hooks and approvals.
# Removing a worktree also closes its Rex sessions, tabs, panes and agents.
# If the launching session belongs to it, switch to a remaining worktree
# (or unrelated live session) before closing the launching session last.
[[worktree]]
path = "~/Projects/app"
icon = ""

[tui]
# Show row icons and ordinary/agent tab icons (requires a Nerd Font).
show_icons = true
prompt = "> "
placeholder = "Filter Sessions..."
pointer = "> "
alias_auto_connect_delay = "150ms"
alias_filter_prefix = "/"
preview = true
preview_width = 60
preview_min_width = 100
preview_border = "line"
group_separator = false

# Each action accepts multiple fzf key names. Omit it to keep defaults;
# an array replaces that action's defaults, and [] disables its shortcuts.
[tui.keybindings]
accept = ["enter", "double-click"]
cancel = ["esc", "ctrl-c", "ctrl-g", "ctrl-q"]
up = ["up", "ctrl-k", "ctrl-p"]
down = ["down", "ctrl-j", "ctrl-n"]
half_page_up = ["ctrl-u"]
half_page_down = ["ctrl-d"]
toggle_preview = ["ctrl-o"]
rename = ["ctrl-r"] # For example: ["ctrl-r", "alt-r", "f2"].
remove = ["ctrl-x"]
refresh = ["ctrl-r"] # Worktree picker only.
create_worktree = ["ctrl-w"] # Worktree picker only.
select_1 = ["1"] # Session picker: choose this row while the query starts with #.
select_2 = ["2"]
select_3 = ["3"]
select_4 = ["4"]
select_5 = ["5"]
select_6 = ["6"]
select_7 = ["7"]
select_8 = ["8"]
select_9 = ["9"]
confirm_yes = ["y"] # Removal confirmation only.
confirm_no = ["n", "q"]
confirm_up = ["up", "ctrl-k", "ctrl-p", "left", "btab"]
confirm_down = ["down", "ctrl-j", "ctrl-n", "right", "tab"]
